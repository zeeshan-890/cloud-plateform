server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    # Gzip compression for low bandwidth / fast load
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static Next.js assets indefinitely (immutable hashes)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Internal reverse-proxy to Gateway microservice (keeps port 8000 private inside Docker network)
    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Project dynamic routes SPA fallback — handles /projects/[projectId] and any subroutes
    location ^~ /projects/ {
        try_files $uri $uri.html $uri/ /projects/default/index.html /projects/index.html /index.html;
    }

    # Universal SPA routing fallback for all client routes — eliminates all 404s
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
