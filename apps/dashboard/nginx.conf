server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    port_in_redirect off;
    absolute_redirect off;

    # Security headers (the per-page Content-Security-Policy is embedded as a hash-based <meta> by scripts/postbuild-csp.mjs).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Reverse-proxy to the gateway (keeps port 8000 private inside the Docker network)
    location /api/ {
        # Re-resolve the gateway through Docker DNS (127.0.0.11) instead of once at nginx start: a restarted or
        # recreated gateway container gets a new IP, and a startup-resolved upstream would answer 502 until nginx restarted.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $jp_gateway http://gateway:8000;
        proxy_pass $jp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # streaming uploads must not be buffered or size-capped here
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        # add-on/database provisioning, backups and large transfers can take minutes
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Every console route is a real exported file (the project page uses /project?id=...), so no SPA fallback is needed.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
