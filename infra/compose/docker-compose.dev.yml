# Development override. NOT for servers.
#
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.dev.yml \
#       --env-file infra/compose/dev.env up -d --build
# (or: scripts/jp-up.sh --dev). Dev secrets/defaults live in infra/compose/dev.env.
#
# What it changes:
#   * publishes the datastores on 127.0.0.1 (still loopback-only) so you can use psql/redis-cli/mc from the host
#   * runtime + worker run as root (Docker Desktop sockets are not group-accessible)
#   * adds mailpit (SMTP catcher, profile "dev"; multi-arch replacement for the amd64-only mailhog)
#   * the container hardening (read-only rootfs, cap_drop ALL, no-new-privileges) is NOT relaxed

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  minio:
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
  runtime:
    user: "0:0"
  worker:
    user: "0:0"

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [dev]
    restart: unless-stopped
    networks: [jp]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"
