# JP Cloud — production Compose stack (single node).
#
# This file contains NO development defaults: every secret/identity value is required and the stack refuses
# to start without it (compose `:?` required-variable syntax). Installers (install.sh / install.ps1) generate a complete `.env`.
# For local development use infra/compose/docker-compose.dev.yml together with infra/compose/dev.env
# (scripts/jp-up.sh --dev does that for you).
#
# Networks
#   jp        platform network. Every platform container + Traefik. Tenant containers NEVER join it.
#   socketproxy  internal-only network between docker-socket-proxy and its two read-only clients (traefik, promtail).
#   (jp_p_<project> networks are created at runtime by the runtime service, one per project; Traefik is
#    attached to each of them with `docker network connect`.)
#
# Docker socket (see docs/SECURITY.md):
#   runtime ......... real socket (creates/stops tenant containers, networks, volumes)      -> root-equivalent on the host
#   worker .......... real socket (docker build / push for tenant code)                     -> root-equivalent on the host
#   docker-socket-proxy  read-only socket, CONTAINERS+NETWORKS only, for traefik and promtail
#   Nothing else mounts the socket. Both socket users run as uid 10001 + the socket's group (DOCKER_GID).
#
# Profiles:  (default) full platform | monitoring | dev | e2e (see docker-compose.e2e.yml)

name: jp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  restart: unless-stopped
  networks: [jp]
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging: *logging

# Go service defaults: non-root, read-only rootfs, writable /tmp only, graceful stop.
x-go: &go
  <<: *hardening
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  stop_grace_period: 20s

x-go-build: &go-build
  context: ../..
  dockerfile: infra/docker/Dockerfile.service
  args: &go-build-args
    VERSION: ${JP_VERSION:-dev}
    COMMIT: ${JP_COMMIT:-unknown}

# Environment shared by every Go service.
x-env-common: &env-common
  JP_ENV: ${JP_ENV:-production}
  JP_LOG_LEVEL: ${JP_LOG_LEVEL:-info}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required (installer generates it)}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, >= 32 random chars (installer generates it)}
  JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
  JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
  ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN is required (e.g. apps.example.com or <ip-dashes>.sslip.io)}
  MANAGEMENT_DOMAIN: ${MANAGEMENT_DOMAIN:-}
  TLS_ENABLED: ${TLS_ENABLED:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required (public URL of the panel, e.g. https://panel.example.com)}
  PUBLIC_DASHBOARD_URL: ${PUBLIC_BASE_URL}
  DASHBOARD_URL: ${PUBLIC_BASE_URL}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  MIGRATIONS_DIR: /app/migrations

# Datastore connections (platform postgres/redis; never exposed outside the jp network).
x-env-data: &env-data
  DATABASE_URL: postgres://${POSTGRES_USER:-jp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-jp}?sslmode=disable
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0

# Internal service addresses (service-to-service calls carry X-Internal-Token).
x-env-urls: &env-urls
  IDENTITY_URL: http://identity:8001
  ORGANIZATION_URL: http://organization:8002
  PROJECT_URL: http://project:8003
  NOTIFICATION_URL: http://notification:8004
  REPOSITORY_URL: http://repository:8005
  DEPLOYMENT_URL: http://deployment:8006
  BUILD_URL: http://build:8007
  REGISTRY_URL: http://registry-api:8009
  RUNTIME_URL: http://runtime:8010
  SCHEDULER_URL: http://scheduler:8011
  DOMAIN_URL: http://domain:8012
  CERTIFICATE_URL: http://certificate:8013
  SECRET_URL: http://secret:8014
  LOGGING_URL: http://logging:8015
  METRICS_URL: http://metrics:8016
  STORAGE_URL: http://storage:8017
  DATABASE_SVC_URL: http://database:8018
  AI_URL: http://ai:8019
  ADDON_SVC_URL: http://addon:8021

x-wait-data: &wait-data
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ---------------------------------------------------------------------------------------------
  # Edge
  # ---------------------------------------------------------------------------------------------
  # One-shot: make the shared Traefik dynamic-config volume writable by the services that generate
  # routers (domain, certificate; uid 10001) while Traefik only reads it.
  init-volumes:
    image: busybox:1.37
    restart: "no"
    networks: [jp]
    user: root
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "mkdir -p /dynamic && chown -R 10001:10001 /dynamic && chmod 755 /dynamic"]
    volumes:
      - traefik_dynamic:/dynamic

  # Read-only filtered view of the Docker API for Traefik and Promtail. Only containers + networks.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    networks: [socketproxy]
    security_opt:
      - no-new-privileges:true
    logging: *logging
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      EVENTS: "1"
      PING: "1"
      VERSION: "1"
      INFO: "0"
      IMAGES: "0"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      SWARM: "0"
      NODES: "0"
      SECRETS: "0"
      CONFIGS: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      EXEC: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      POST: "0"
      AUTH: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.20"

  traefik:
    <<: *hardening
    image: traefik:v3.6.25
    container_name: jp-traefik
    read_only: true
    cap_add: [NET_BIND_SERVICE]
    networks: [jp, socketproxy]
    # Static configuration is assembled in a tiny shell wrapper so that TLS/ACME flags exist ONLY when
    # TLS_ENABLED=true (a static file cannot be conditional). `api.insecure` is never set: the dashboard is
    # an ordinary router on the `traefik` entrypoint, bound to 127.0.0.1 and behind basic auth.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -- \
          --global.checknewversion=false --global.sendanonymoususage=false \
          --log.level="$${TRAEFIK_LOG_LEVEL:-INFO}" \
          --accesslog=true --accesslog.format=json --accesslog.fields.headers.defaultmode=drop \
          --ping=true --ping.entrypoint=web \
          --entrypoints.web.address=:80 \
          --entrypoints.websecure.address=:443 \
          --entrypoints.web.transport.respondingtimeouts.readtimeout=30m \
          --entrypoints.web.transport.respondingtimeouts.writetimeout=0s \
          --entrypoints.web.transport.respondingtimeouts.idletimeout=5m \
          --entrypoints.websecure.transport.respondingtimeouts.readtimeout=30m \
          --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0s \
          --entrypoints.websecure.transport.respondingtimeouts.idletimeout=5m \
          --providers.providersthrottleduration=200ms \
          --serverstransport.forwardingtimeouts.dialtimeout=2s \
          --providers.docker=true \
          --providers.docker.endpoint=tcp://docker-socket-proxy:2375 \
          --providers.docker.exposedbydefault=false \
          --providers.docker.network=jp \
          --providers.file.directory=/etc/traefik/dynamic \
          --providers.file.watch=true
        # Traefik is attached to every tenant network (it must route to them), so anything it LISTENS on is reachable
        # from tenant containers. The dashboard/API and metrics entrypoints are therefore OFF by default.
        if [ "$${TRAEFIK_DASHBOARD:-false}" = "true" ]; then
          set -- "$$@" --api.dashboard=true --entrypoints.traefik.address=:8080
        fi
        if [ "$${TRAEFIK_METRICS:-false}" = "true" ]; then
          set -- "$$@" --entrypoints.metrics.address=:8082 --metrics.prometheus=true --metrics.prometheus.entrypoint=metrics
        fi
        if [ "$${TLS_ENABLED:-false}" = "true" ]; then
          [ -n "$${ACME_EMAIL:-}" ] || { echo "FATAL: ACME_EMAIL is required when TLS_ENABLED=true" >&2; exit 1; }
          [ -n "$${MANAGEMENT_DOMAIN:-}" ] || { echo "FATAL: MANAGEMENT_DOMAIN is required when TLS_ENABLED=true (a certificate cannot be issued for a bare IP)" >&2; exit 1; }
          set -- "$$@" \
            --entrypoints.web.http.redirections.entrypoint.to=websecure \
            --entrypoints.web.http.redirections.entrypoint.scheme=https \
            --entrypoints.websecure.http.tls=true \
            --entrypoints.websecure.http.tls.certresolver=letsencrypt \
            --certificatesresolvers.letsencrypt.acme.email="$$ACME_EMAIL" \
            --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json \
            --certificatesresolvers.letsencrypt.acme.httpchallenge=true \
            --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
          if [ "$${ACME_STAGING:-false}" = "true" ]; then
            set -- "$$@" --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
          fi
        fi
        exec traefik "$$@"
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-false}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-false}
      MANAGEMENT_DOMAIN: ${MANAGEMENT_DOMAIN:-}
      TRAEFIK_LOG_LEVEL: ${TRAEFIK_LOG_LEVEL:-INFO}
      TRAEFIK_DASHBOARD: ${TRAEFIK_DASHBOARD:-false}
      TRAEFIK_METRICS: ${TRAEFIK_METRICS:-false}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/acme
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      - traefik.http.routers.traefik-dashboard.entrypoints=traefik
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-auth
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH:?TRAEFIK_DASHBOARD_AUTH is required (htpasswd line; installer generates it)}
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:80/ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.50"

  # ---------------------------------------------------------------------------------------------
  # Datastores (never published outside 127.0.0.1; the dev override publishes them on loopback)
  # ---------------------------------------------------------------------------------------------
  postgres:
    <<: *hardening
    image: postgres:16.9-alpine3.21
    # the stock entrypoint chowns the data dir and drops to the postgres user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-jp}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    shm_size: 128m
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  redis:
    <<: *hardening
    image: redis:7.4-alpine3.21
    # run as the image's redis user (uid 999) directly: the compose command bypasses the image entrypoint that would chown+drop privileges
    user: "999:1000"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save 60 1 --appendonly yes --maxmemory "$${REDIS_MAXMEMORY:-192mb}" --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.50"

  # Image registry for tenant builds. Published on loopback ONLY: the host Docker daemon (which the worker
  # pushes through and the runtime pulls through) reaches it as 127.0.0.1:5000, which Docker treats as a
  # trusted/insecure registry by default. Image names are always `127.0.0.1:5000/<org>/<project>:<tag>`.
  registry:
    <<: *hardening
    image: registry:2.8.3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: ":5000"
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:?REGISTRY_HTTP_SECRET is required (installer generates it)}
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
      # Optional second binding so servers that join the cluster can pull tenant images over the private network
      # (their node agent forwards 127.0.0.1:5000 here). Defaults to an unused loopback port = nothing exposed.
      - "${REGISTRY_PRIVATE_BIND:-127.0.0.1}:${REGISTRY_PRIVATE_PORT:-5001}:5000"
    volumes:
      - registry_data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.30"

  minio:
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.minio
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    image: jp-minio:${MINIO_VERSION:-RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (installer generates it)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (installer generates it)}
      MINIO_BROWSER: ${MINIO_BROWSER:-on}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"

  # ---------------------------------------------------------------------------------------------
  # Control plane
  # ---------------------------------------------------------------------------------------------
  gateway:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: gateway}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/gateway:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8000"
      GOMEMLIMIT: 150MiB
      # read by the security report: asserts databases/queues listen on loopback only (see `ports:` of each service)
      INFRA_BIND_ADDR: 127.0.0.1
      JP_VERSION: ${JP_VERSION:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_BASE_URL}}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-}
      # multi-server: what joining servers use to pull images (host:port) and the control plane's private address
      NODE_REGISTRY_UPSTREAM: ${NODE_REGISTRY_UPSTREAM:-}
      CONTROL_PLANE_PRIVATE_IP: ${CONTROL_PLANE_PRIVATE_IP:-}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-}
      BUILD_MODE: ${BUILD_MODE:-docker}
      RUNTIME_MODE: ${RUNTIME_MODE:-docker}
      TRIVY_ENABLED: ${TRIVY_ENABLED:-true}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    depends_on:
      <<: *wait-data
      identity:
        condition: service_healthy
      organization:
        condition: service_healthy
      project:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=jp
      # Management hostname (only matches when MANAGEMENT_DOMAIN is set; `.invalid` never resolves)
      - traefik.http.routers.jp-gw-host.rule=Host(`${MANAGEMENT_DOMAIN:-mgmt.invalid}`) && PathPrefix(`/api`)
      - traefik.http.routers.jp-gw-host.entrypoints=web,websecure
      - traefik.http.routers.jp-gw-host.priority=200
      - traefik.http.routers.jp-gw-host.service=jp-gateway
      # Bare-IP / localhost access (IP installs): catch-all for IP-literal Host headers only, so an
      # unknown or unverified hostname never lands on the panel
      - traefik.http.routers.jp-gw-ip.rule=(HostRegexp(`^(\d{1,3}\.){3}\d{1,3}$$`) || Host(`localhost`)) && PathPrefix(`/api`)
      - traefik.http.routers.jp-gw-ip.entrypoints=web,websecure
      - traefik.http.routers.jp-gw-ip.priority=150
      - traefik.http.routers.jp-gw-ip.service=jp-gateway
      - traefik.http.services.jp-gateway.loadbalancer.server.port=8000
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.75"

  identity:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: identity}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/identity:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8001"
      GOMEMLIMIT: 150MiB
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      # encrypts TOTP seeds and persisted settings (SMTP password, ...); base64 of 32 random bytes
      IDENTITY_ENC_KEY: "${IDENTITY_ENC_KEY:?IDENTITY_ENC_KEY is required: base64 of 32 random bytes (installer generates it)}"
      # optional: when set, POST /auth/bootstrap (first admin) must carry it
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.75"

  organization:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: organization}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/organization:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8002"
      GOMEMLIMIT: 100MiB
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

  project:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: project}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/project:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8003"
      GOMEMLIMIT: 100MiB
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.50"

  notification:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: notification}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/notification:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-urls]
      PORT: "8004"
      GOMEMLIMIT: 50MiB
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.15"

  dashboard:
    <<: *hardening
    # The dashboard image runs nginx; nginx's master process needs a few capabilities, so no cap_drop here.
    cap_drop: []
    build:
      context: ../../apps/dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/dashboard:${JP_IMAGE_TAG:-local}
    environment:
      PORT: "3000"
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.docker.network=jp
      - traefik.http.routers.jp-ui-host.rule=Host(`${MANAGEMENT_DOMAIN:-mgmt.invalid}`)
      - traefik.http.routers.jp-ui-host.entrypoints=web,websecure
      - traefik.http.routers.jp-ui-host.priority=100
      - traefik.http.routers.jp-ui-host.service=jp-dashboard
      - traefik.http.routers.jp-ui-host.middlewares=jp-secure-headers
      - traefik.http.routers.jp-ui-ip.rule=HostRegexp(`^(\d{1,3}\.){3}\d{1,3}$$`) || Host(`localhost`)
      - traefik.http.routers.jp-ui-ip.entrypoints=web,websecure
      - traefik.http.routers.jp-ui-ip.priority=50
      - traefik.http.routers.jp-ui-ip.service=jp-dashboard
      - traefik.http.routers.jp-ui-ip.middlewares=jp-secure-headers
      - traefik.http.services.jp-dashboard.loadbalancer.server.port=3000
      - traefik.http.middlewares.jp-secure-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.jp-secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.jp-secure-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.jp-secure-headers.headers.stsSeconds=${HSTS_SECONDS:-0}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.35"

  # ---------------------------------------------------------------------------------------------
  # Delivery pipeline
  # ---------------------------------------------------------------------------------------------
  repository:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: repository}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/repository:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8005"
      GOMEMLIMIT: 100MiB
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      # encrypts stored repository tokens / deploy keys (base64 or hex of 32 bytes)
      REPO_ENC_KEY: "${REPO_ENC_KEY:?REPO_ENC_KEY is required: base64 of 32 random bytes (installer generates it)}"
      GITHUB_MODE: ${GITHUB_MODE:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.30"

  deployment:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: deployment}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/deployment:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8006"
      GOMEMLIMIT: 100MiB
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-}
      TRIVY_ENABLED: ${TRIVY_ENABLED:-true}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.30"

  build:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: build}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/build:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8007"
      GOMEMLIMIT: 100MiB
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.30"

  # Build worker: git + docker CLI + buildx + trivy. Runs as uid 10001 with the docker socket's group.
  # Customer code is built by the HOST daemon (docker build), never executed in this container.
  worker:
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        <<: *go-build-args
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/worker:${JP_IMAGE_TAG:-local}
    user: "10001:10001"
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required: group id owning /var/run/docker.sock (installer sets it; `stat -c %g /var/run/docker.sock`)}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m,uid=10001,gid=10001
      - /home/jp:rw,nosuid,size=16m,uid=10001,gid=10001
    stop_grace_period: 150s
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8008"
      GOMEMLIMIT: 560MiB
      BUILD_MODE: ${BUILD_MODE:-docker}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_NAME: ${WORKER_NAME:-}
      WORK_DIR: /work
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_CONFIG: /tmp/.docker
      HOME: /home/jp
      TRIVY_ENABLED: ${TRIVY_ENABLED:-true}
      TRIVY_CACHE_DIR: /cache/trivy
      # Pushed with the HOST daemon -> must be an address the host can reach: the loopback-published registry.
      REGISTRY_PUSH_URL: 127.0.0.1:${REGISTRY_PORT:-5000}
      REGISTRY_HOST: 127.0.0.1:${REGISTRY_PORT:-5000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REGISTRY_CHECK_URL: http://registry:5000
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      GIT_ALLOWED_HOSTS: ${GIT_ALLOWED_HOSTS:-}
      TRIVY_TIMEOUT: ${TRIVY_TIMEOUT:-}
      WORKER_BUILD_MEMORY: ${WORKER_BUILD_MEMORY:-}
      WORKER_BUILD_TIMEOUT: ${WORKER_BUILD_TIMEOUT:-}
      WORKER_CLONE_TIMEOUT: ${WORKER_CLONE_TIMEOUT:-}
      WORKER_PUSH_TIMEOUT: ${WORKER_PUSH_TIMEOUT:-}
      WORKER_CLAIM_IDLE: ${WORKER_CLAIM_IDLE:-}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-}
      WORKER_MAX_REPO_MB: ${WORKER_MAX_REPO_MB:-}
      WORKER_MIN_FREE_MB: ${WORKER_MIN_FREE_MB:-}
      WORKER_DRAIN_TIMEOUT: ${WORKER_DRAIN_TIMEOUT:-120s}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_builds:/work
      - worker_trivy_cache:/cache
    depends_on:
      redis:
        condition: service_healthy
      build:
        condition: service_healthy
      deployment:
        condition: service_healthy
      registry-api:
        condition: service_healthy
      registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  registry-api:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: registry}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/registry:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8009"
      GOMEMLIMIT: 100MiB
      REGISTRY_HOST: 127.0.0.1:${REGISTRY_PORT:-5000}
      REGISTRY_API_URL: http://registry:5000
      REGISTRY_REF_HOSTS: 127.0.0.1:${REGISTRY_PORT:-5000}
      REGISTRY_USER: ${REGISTRY_USER:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
    depends_on:
      <<: *wait-data
      registry:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  # Runtime: creates tenant containers/networks on the host daemon. Runs as uid 10001 + docker group.
  # This is the most privileged service in the stack (docs/SECURITY.md).
  runtime:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: runtime}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/runtime:${JP_IMAGE_TAG:-local}
    group_add:
      - "${DOCKER_GID:?DOCKER_GID is required: group id owning /var/run/docker.sock (installer sets it)}"
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8010"
      GOMEMLIMIT: 200MiB
      RUNTIME_MODE: ${RUNTIME_MODE:-docker}
      DOCKER_HOST: unix:///var/run/docker.sock
      TRAEFIK_CONTAINER: jp-traefik
      RUNTIME_PROBER_CONTAINER: jp-prober
      METRICS_SAMPLE_INTERVAL: ${METRICS_SAMPLE_INTERVAL:-}
      RUNTIME_ALLOWED_IMAGE_PREFIXES: ${RUNTIME_ALLOWED_IMAGE_PREFIXES:-}
      RUNTIME_RECONCILE_INTERVAL: ${RUNTIME_RECONCILE_INTERVAL:-}
      RUNTIME_DRAIN_TIME: ${RUNTIME_DRAIN_TIME:-}
      RUNTIME_STOP_TIMEOUT: ${RUNTIME_STOP_TIMEOUT:-}
      RUNTIME_HEALTH_TIMEOUT: ${RUNTIME_HEALTH_TIMEOUT:-}
      RUNTIME_HEALTH_INTERVAL: ${RUNTIME_HEALTH_INTERVAL:-}
      RUNTIME_MAX_MEMORY_MB: ${RUNTIME_MAX_MEMORY_MB:-}
      RUNTIME_MAX_CPUS: ${RUNTIME_MAX_CPUS:-}
      RUNTIME_MAX_JOBS: ${RUNTIME_MAX_JOBS:-}
      RUNTIME_JOB_TIMEOUT: ${RUNTIME_JOB_TIMEOUT:-}
      RUNTIME_JOB_MAX_TIMEOUT: ${RUNTIME_JOB_MAX_TIMEOUT:-}
      REGISTRY_HOST: 127.0.0.1:${REGISTRY_PORT:-5000}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      <<: *wait-data
      traefik:
        condition: service_healthy
      prober:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  # Probe sidecar: the runtime runs health probes inside this container (docker exec wget/nc). The runtime docker-network-connects it
  # to each project network, so the runtime service itself never joins (and is never reachable from) tenant networks.
  prober:
    <<: *hardening
    image: busybox:1.37
    container_name: jp-prober
    command: ["sleep", "2147483647"]
    user: "65534:65534"
    read_only: true
    deploy:
      resources:
        limits:
          memory: 16M
          cpus: "0.10"

  scheduler:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: scheduler}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/scheduler:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8011"
      GOMEMLIMIT: 50MiB
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-1h}
      PREVIEW_TTL: ${PREVIEW_TTL:-72h}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-}
      ORPHAN_IMAGE_TTL: ${ORPHAN_IMAGE_TTL:-168h}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.15"

  # Domain service: owns every Traefik router (file provider). Writes the dynamic dir; Traefik mounts it read-only.
  domain:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: domain}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/domain:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8012"
      GOMEMLIMIT: 100MiB
      DOMAIN_CNAME_TARGET: ${DOMAIN_CNAME_TARGET:-}
      DOMAIN_A_TARGETS: ${DOMAIN_A_TARGETS:-${PUBLIC_IP:-}}
      PREVIEW_BASE_DOMAIN: ${PREVIEW_BASE_DOMAIN:-}
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      TRAEFIK_CERT_RESOLVER: letsencrypt
      DNS_RESOLVER: ${DNS_RESOLVER:-}
      DOMAIN_ALLOW_INTERNAL_TLDS: ${DOMAIN_ALLOW_INTERNAL_TLDS:-false}
      PREVIEW_TLS: ${PREVIEW_TLS:-${TLS_ENABLED:-false}}
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic
    depends_on:
      <<: *wait-data
      init-volumes:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.30"

  certificate:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: certificate}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/certificate:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8013"
      GOMEMLIMIT: 50MiB
      TRAEFIK_CERT_RESOLVER: letsencrypt
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      TLS_PROBE_ADDR: ${TLS_PROBE_ADDR:-traefik:443}
      ACME_STAGING: ${ACME_STAGING:-false}
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic
    depends_on:
      <<: *wait-data
      init-volumes:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.15"

  secret:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: secret}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/secret:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8014"
      GOMEMLIMIT: 100MiB
      # base64 of 32 random bytes. Losing or changing this key makes every stored secret unreadable.
      SECRETS_MASTER_KEY: "${SECRETS_MASTER_KEY:?SECRETS_MASTER_KEY is required: base64 of 32 random bytes (installer generates it)}"
      # key rotation: set SECRETS_KEY_VERSION=2, move the old key to SECRETS_MASTER_KEY_PREVIOUS, then POST /internal/rotate-master-key
      SECRETS_KEY_VERSION: ${SECRETS_KEY_VERSION:-}
      SECRETS_MASTER_KEY_PREVIOUS: ${SECRETS_MASTER_KEY_PREVIOUS:-}
      SECRETS_KEY_VERSION_PREVIOUS: ${SECRETS_KEY_VERSION_PREVIOUS:-}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  logging:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: logging}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/logging:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8015"
      GOMEMLIMIT: 100MiB
      LOKI_URL: ${LOKI_URL:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  metrics:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: metrics}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/metrics:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8016"
      GOMEMLIMIT: 50MiB
      METRICS_MODE: ${METRICS_MODE:-live}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.15"

  # ---------------------------------------------------------------------------------------------
  # Data services
  # ---------------------------------------------------------------------------------------------
  storage:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: storage}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/storage:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8017"
      GOMEMLIMIT: 100MiB
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_USE_SSL: "false"
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-${PUBLIC_BASE_URL}}
      STORAGE_QUOTA_MB: ${STORAGE_QUOTA_MB:-1024}
      STORAGE_MAX_OBJECT_MB: ${STORAGE_MAX_OBJECT_MB:-}
      STORAGE_MAX_UPLOAD_MB: ${STORAGE_MAX_UPLOAD_MB:-16}
    depends_on:
      <<: *wait-data
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  database:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: database}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/database:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8018"
      GOMEMLIMIT: 100MiB
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  addon:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: addon}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/addon:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8021"
      GOMEMLIMIT: 100MiB
      ADDON_CATALOG_DIR: ${ADDON_CATALOG_DIR:-}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  ai:
    <<: *go
    build:
      <<: *go-build
      args: {<<: *go-build-args, SERVICE: ai}
    image: ${JP_IMAGE_REGISTRY:-ghcr.io/zeeshan-890/cloud-plateform}/ai:${JP_IMAGE_TAG:-local}
    environment:
      <<: [*env-common, *env-data, *env-urls]
      PORT: "8019"
      GOMEMLIMIT: 100MiB
      # Encrypts per-organization provider API keys at rest.
      AI_PLATFORM_PROVIDER: ${AI_PLATFORM_PROVIDER:-}
      AI_PLATFORM_MODEL: ${AI_PLATFORM_MODEL:-}
      AI_PLATFORM_KEY: ${AI_PLATFORM_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_RATE_PER_MIN: ${AI_RATE_PER_MIN:-}
      AI_ALLOW_PRIVATE_BASE_URL: ${AI_ALLOW_PRIVATE_BASE_URL:-false}
      AI_ENC_KEY: "${AI_ENC_KEY:?AI_ENC_KEY is required: base64 of 32 random bytes (installer generates it)}"
      AI_BASE_URL: ${AI_BASE_URL:-}
    depends_on: *wait-data
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"

  # ---------------------------------------------------------------------------------------------
  # Monitoring profile (optional). Everything is loopback-only; Grafana is the only thing that can be
  # routed through Traefik (GRAFANA_DOMAIN), protected by its own login (anonymous access is OFF).
  # ---------------------------------------------------------------------------------------------
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.30"

  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required when the monitoring profile is enabled}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001/}
    volumes:
      - ../monitoring/grafana:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    labels:
      - traefik.enable=true
      - traefik.docker.network=jp
      - traefik.http.routers.jp-grafana.rule=Host(`${GRAFANA_DOMAIN:-grafana.invalid}`)
      - traefik.http.routers.jp-grafana.entrypoints=web,websecure
      - traefik.http.routers.jp-grafana.middlewares=jp-secure-headers@docker
      - traefik.http.services.jp-grafana.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.30"

  loki:
    <<: *hardening
    image: grafana/loki:3.1.1
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../monitoring/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.30"

  tempo:
    <<: *hardening
    image: grafana/tempo:2.6.0
    profiles: [monitoring]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ../monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.30"

  # Container logs -> Loki, discovered through the READ-ONLY socket proxy (no raw docker.sock mount).
  promtail:
    <<: *hardening
    image: grafana/promtail:3.1.1
    profiles: [monitoring]
    networks: [jp, socketproxy]
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ../monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - promtail_positions:/positions
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.15"

networks:
  jp:
    name: jp
    driver: bridge
  socketproxy:
    name: jp_socketproxy
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  registry_data:
  minio_data:
  worker_builds:
  worker_trivy_cache:
  traefik_acme:
  traefik_dynamic:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
  promtail_positions:
