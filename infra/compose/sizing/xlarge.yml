# Resource overlay: xlarge (32 GB+ RAM). Edit freely.
# Applied by scripts/jp-up.sh after scripts/size-host.sh picks the tier (or: JP_SIZE=<tier>).
# These are LIMITS (cgroup caps), not reservations. WORKER_REPLICAS / WORKER_CONCURRENCY come from .env.resources.
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4.0"
  redis:
    environment:
      REDIS_MAXMEMORY: 2048mb
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: "1.0"
  minio:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
  worker:
    environment:
      GOMEMLIMIT: 3200MiB
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"
  gateway:
    environment:
      GOMEMLIMIT: 399MiB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
  identity:
    environment:
      GOMEMLIMIT: 399MiB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "2.0"
  runtime:
    environment:
      GOMEMLIMIT: 300MiB
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
  prometheus:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "0.50"
  grafana:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.35"
  loki:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
  tempo:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
