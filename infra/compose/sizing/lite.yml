# Resource overlay: lite (~1GB RAM / 0.5-1 vCPU)
# Ultra-lightweight profile:
# - Minimal PostgreSQL footprint (~16MB RAM, fsync=off for instant zero-lag disk I/O)
# - Ephemeral Redis with maxmemory=16MB (no fork/RDB disk dump overhead)
# - Go GOMEMLIMIT=24MiB & GOGC=50 for aggressive memory reclamation
# - Dashboard served via ultra-light Nginx (~5MB RAM)
# - Heavy monitoring (Prometheus, Grafana, Loki, Tempo) disabled
# - Entire platform baseline consumes < 150MB total RAM
services:
  traefik:
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.05"

  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=8MB
      - -c
      - max_connections=15
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=4MB
      - -c
      - wal_buffers=512kB
      - -c
      - min_wal_size=16MB
      - -c
      - max_wal_size=64MB
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    deploy:
      resources:
        limits:
          memory: 48M
          cpus: "0.10"

  redis:
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "16mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 24M
          cpus: "0.05"

  gateway:
    environment:
      GOMEMLIMIT: "24MiB"
      GOGC: "50"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.05"

  identity:
    environment:
      GOMEMLIMIT: "24MiB"
      GOGC: "50"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.05"

  organization:
    environment:
      GOMEMLIMIT: "24MiB"
      GOGC: "50"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.05"

  project:
    environment:
      GOMEMLIMIT: "24MiB"
      GOGC: "50"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.05"

  notification:
    environment:
      GOMEMLIMIT: "24MiB"
      GOGC: "50"
    deploy:
      resources:
        limits:
          memory: 24M
          cpus: "0.05"

  dashboard:
    deploy:
      resources:
        limits:
          memory: 24M
          cpus: "0.05"
