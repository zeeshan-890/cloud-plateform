# Resource overlay: small (~4GB RAM / 2 vCPU)
# Tight limits — keep monitoring off unless demonstrating.
services:
  traefik:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
  redis:
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.25"
  gateway:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
  identity:
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.35"
  organization:
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.30"
  project:
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.30"
  worker:
    environment:
      WORKER_CONCURRENCY: "1"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
  registry:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.20"
  minio:
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
  prometheus:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
  grafana:
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.20"
  loki:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
  tempo:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
