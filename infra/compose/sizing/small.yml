# Resource overlay: small (< 6 GB RAM). Edit freely.
# Applied by scripts/jp-up.sh after scripts/size-host.sh picks the tier (or: JP_SIZE=<tier>).
# These are LIMITS (cgroup caps), not reservations. WORKER_REPLICAS / WORKER_CONCURRENCY come from .env.resources.
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
  redis:
    environment:
      REDIS_MAXMEMORY: 192mb
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.50"
  minio:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"
  worker:
    environment:
      GOMEMLIMIT: 600MiB
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
  prometheus:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"
  grafana:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.35"
  loki:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"
  tempo:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.50"
