# Resource overlay: medium (6 - 16 GB RAM). Edit freely.
# Applied by scripts/jp-up.sh after scripts/size-host.sh picks the tier (or: JP_SIZE=<tier>).
# These are LIMITS (cgroup caps), not reservations. WORKER_REPLICAS / WORKER_CONCURRENCY come from .env.resources.
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2.0"
  redis:
    environment:
      REDIS_MAXMEMORY: 448mb
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: "0.50"
  minio:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
  worker:
    environment:
      GOMEMLIMIT: 1600MiB
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
  gateway:
    environment:
      GOMEMLIMIT: 199MiB
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
  identity:
    environment:
      GOMEMLIMIT: 199MiB
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
  runtime:
    environment:
      GOMEMLIMIT: 300MiB
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
  prometheus:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
  grafana:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.35"
  loki:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
  tempo:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
