# Resource overlay: large (16 - 32 GB RAM). Edit freely.
# Applied by scripts/jp-up.sh after scripts/size-host.sh picks the tier (or: JP_SIZE=<tier>).
# These are LIMITS (cgroup caps), not reservations. WORKER_REPLICAS / WORKER_CONCURRENCY come from .env.resources.
services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"
  redis:
    environment:
      REDIS_MAXMEMORY: 1024mb
    deploy:
      resources:
        limits:
          memory: 1280M
          cpus: "1.0"
  minio:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
  worker:
    environment:
      GOMEMLIMIT: 2400MiB
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3.0"
  gateway:
    environment:
      GOMEMLIMIT: 299MiB
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.5"
  identity:
    environment:
      GOMEMLIMIT: 299MiB
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.5"
  runtime:
    environment:
      GOMEMLIMIT: 300MiB
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "1.0"
  prometheus:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.50"
  grafana:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.35"
  loki:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.50"
  tempo:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "0.50"
