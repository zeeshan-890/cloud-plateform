# End-to-end test override: adds a controllable DNS server and points the domain service at it.
#
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.e2e.yml up -d
#   (or: scripts/jp-up.sh --e2e)
#
# How the e2e suite proves custom-domain verification against REAL DNS lookups:
#   * `dns` (CoreDNS) serves every zone file found in infra/e2e/dns/zones (file name `db.<zone>`).
#   * The domain service resolves through it (DNS_RESOLVER=dns:53), so a TXT record
#     `_jp-challenge.app.e2e.test. TXT "jp-verify=<token>"` written into zones/db.e2e.test makes
#     verification succeed; removing it makes it fail again. No public DNS is involved.
#   * Edit the files on the HOST (the directory is bind-mounted read-only into the container, CoreDNS reloads
#     every 2s). `scripts/e2e-dns.sh set|del|show` does atomic rewrites with a fresh SOA serial.
#   * The port is published on 127.0.0.1:${E2E_DNS_PORT:-5353} (udp+tcp) for `dig -p 5353 @127.0.0.1 ...` debugging.
#
# There is deliberately no git server: the suite builds PUBLIC GitHub repositories.

services:
  dns:
    image: coredns/coredns:1.11.3
    restart: unless-stopped
    networks: [jp]
    command: ["-conf", "/etc/coredns/Corefile"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ../e2e/dns/Corefile:/etc/coredns/Corefile:ro
      - ../e2e/dns/zones:/zones:ro
    ports:
      - "127.0.0.1:${E2E_DNS_PORT:-5353}:53/udp"
      - "127.0.0.1:${E2E_DNS_PORT:-5353}:53/tcp"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.10"

  domain:
    environment:
      DNS_RESOLVER: dns:53
    depends_on:
      - dns

  # the e2e suite uses http://<host>:3000 (dashboard) - make sure it is reachable from the test runner
  dashboard:
    ports: !override
      - "${DASHBOARD_BIND:-0.0.0.0}:${DASHBOARD_PORT:-3000}:3000"
