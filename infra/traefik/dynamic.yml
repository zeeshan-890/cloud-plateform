# Legacy single-file provider — prefer dynamic/gateway.yml + directory provider.
# Kept for reference; Compose mounts infra/traefik/dynamic/ as the file provider directory.
http:
  routers:
    gateway:
      rule: Host(`localhost`) || Host(`jp.localhost`) || PathPrefix(`/api`)
      entryPoints:
        - web
      service: gateway
  services:
    gateway:
      loadBalancer:
        servers:
          - url: http://gateway:8000
