# Base Traefik routes (file provider directory).
# Per-app domain routers are written here by the domain service as domain-*.yml
http:
  routers:
    # 1. Microservice API Gateway: matches all /api requests
    gateway:
      rule: PathPrefix(`/api`)
      priority: 100
      entryPoints:
        - web
        - websecure
      service: gateway
      tls: {}

    # 2. Main Platform Panel: matches panel.<domain>, panel.localhost, panel.jp.localhost
    panel:
      rule: HostRegexp(`^panel\..+`) || Host(`panel.localhost`) || Host(`panel.jp.localhost`)
      priority: 50
      entryPoints:
        - web
        - websecure
      service: dashboard
      tls:
        certResolver: letsencrypt

    # 3. Universal Fallback: matches any direct IP or host root traffic to Web Dashboard
    dashboard-fallback:
      rule: PathPrefix(`/`)
      priority: 1
      entryPoints:
        - web
        - websecure
      service: dashboard
      tls: {}

  services:
    gateway:
      loadBalancer:
        servers:
          - url: http://gateway:8000
    dashboard:
      loadBalancer:
        servers:
          - url: http://dashboard:3000
