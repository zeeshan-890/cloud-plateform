# Promtail (monitoring profile): container logs -> Loki.
# Containers are discovered through the READ-ONLY docker-socket-proxy (containers + networks only);
# promtail never mounts /var/run/docker.sock.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: tcp://docker-socket-proxy:2375
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_jp_managed"]
        target_label: jp_managed
      - source_labels: ["__meta_docker_container_label_jp_project"]
        target_label: jp_project
