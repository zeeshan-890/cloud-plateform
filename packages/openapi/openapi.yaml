components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    env:
      name: env
      in: path
      required: true
      schema: { type: string, enum: [development, preview, staging, production] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PAT:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token_prefix: { type: string }
        scopes:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
    PATCreated:
      allOf:
        - $ref: "#/components/schemas/PAT"
        - type: object
          properties:
            token: { type: string }
    Org:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }
    Invite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        joined_at: { type: string, format: date-time }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Deployment:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, building, ready, failed] }
        source: { type: string }
        git_sha: { type: string }
        git_branch: { type: string }
        image_ref: { type: string }
        build_id: { type: string, format: uuid }
        rollback_of: { type: string, format: uuid }
        commit_status: { type: string }
        preview_url: { type: string, description: "Traefik-backed preview hostname URL when Kind=Preview" }
        created_at: { type: string, format: date-time }
    Build:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        framework: { type: string }
        image_ref: { type: string }
        git_sha: { type: string }
        logs: { type: string }
        created_at: { type: string, format: date-time }
    RuntimeInstance:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        image_ref: { type: string }
        status: { type: string }
        desired_state: { type: string }
        mode: { type: string, enum: [simulate, docker] }
        health_status: { type: string }
        container_id: { type: string }
    Domain:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        status: { type: string }
        verification_type: { type: string }
        certificate_id: { type: string, format: uuid }
    Certificate:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        status: { type: string }
        provider: { type: string }
        expires_at: { type: string, format: date-time }
        renewed_at: { type: string, format: date-time }
    AddonCatalogItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [database, cache, queue] }
        description: { type: string }
        secret_keys:
          type: array
          items: { type: string }
        modes_supported:
          type: array
          items: { type: string }
    ManagedAddon:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        engine: { type: string }
        name: { type: string }
        mode: { type: string }
        status: { type: string }
        endpoint: { type: string }
        secret_ref: { type: string }
        connection_hint: { type: string }
        created_at: { type: string, format: date-time }
