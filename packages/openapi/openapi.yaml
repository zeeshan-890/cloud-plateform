        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/env"
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
    put:
      tags: [Secrets]
      summary: Set or rotate secret value
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
        - $ref: "#/components/parameters/env"
        - name: name
          in: path
