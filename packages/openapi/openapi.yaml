    put:
      tags: [Config]
      summary: Apply jp.yaml desired state (validated)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                raw: { type: string }
                config: { type: object }
                manifest: { type: object }
      responses:
        "200":
          description: Applied
    post:
      tags: [Config]
      summary: Apply jp.yaml desired state (alias)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: Applied
  /orgs/{orgId}/projects/{projectId}/config/drift:
    get:
      tags: [Config]
      summary: Compare the applied config hash with ?desired_hash
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
        - name: desired_hash
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "{drift, method: hash-compare, applied_hash, details}"
    post:
      tags: [Config]
      summary: Compare a desired config body key-by-key with the applied config
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                config: { type: object }
      responses:
        "200":
          description: "{drift, method: config-compare, details}"
  /orgs/{orgId}/projects/{projectId}/ai/explain:
    post:
      tags: [AI]
      summary: Explain failed deployment/build (LLM or simulate)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deployment_id: { type: string }
                build_id: { type: string }
                prompt: { type: string }
      responses:
        "200":
          description: Explanation
  /orgs/{orgId}/ai/ask:
    post:
      tags: [AI]
      summary: Ask AI ops a prompt
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
                project_id: { type: string }
      responses:
        "200":
          description: Answer
  /orgs/{orgId}/ai/status:
    get:
      tags: [AI]
      summary: AI mode (simulate|openai)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
  /system/settings:
    get:
      tags: [System]
      summary: Effective non-secret platform configuration + editable settings (platform admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
        "403":
          $ref: "#/components/responses/Error"
    patch:
      tags: [System]
      summary: Persist SMTP / AI-key settings (platform admin; secrets are write-only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Keys: smtp_host, smtp_port, smtp_username, smtp_password, smtp_from, smtp_tls, ai_openai_api_key, ai_openrouter_api_key, ai_gemini_api_key, ai_base_url, ai_model. Empty string removes a key."
              additionalProperties: { type: string }
      responses:
        "200":
          description: OK
  /system/security:
    get:
      tags: [System]
      summary: Real security checks computed from live state (platform admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        status: { type: string, enum: [pass, warn, fail] }
                        detail: { type: string }
                  summary: { type: object, additionalProperties: { type: integer } }
  /system/cluster:
    get:
      tags: [System]
      summary: The single local node - live CPU, memory, disk, container counts (platform admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /cluster/nodes:
    get:
      tags: [System]
      summary: Node list (always exactly the local node; multi-node is not implemented)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
  /system/maintenance/cleanup:
    post:
      tags: [System]
      summary: Prune jp-managed dangling images/containers via the runtime (platform admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Result reported by the runtime
        "502":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    orgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    env:
      name: env
      in: path
      required: true
      schema: { type: string, enum: [development, preview, staging, production] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        is_admin: { type: boolean }
        username: { type: string }
        managed: { type: boolean }
        must_change_password: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    GrantRequest:
      type: object
      required: [project_id]
      properties:
        project_id: { type: string, format: uuid }
        preset: { type: string, enum: [viewer, developer, operator, project_admin, custom] }
        areas:
          type: object
          description: "area -> none|view|manage (custom preset). Areas: overview, deployments, builds, runtime, domains, secrets, addons, databases, storage, logs, metrics, repository, settings"
          additionalProperties: { type: string, enum: [none, view, manage] }
        secrets_reveal: { type: boolean, description: "May read plaintext secret values / add-on passwords" }
    MFAChallenge:
      type: object
      properties:
        mfa_required: { type: boolean }
        mfa_token: { type: string }
        expires_in: { type: integer }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    AuthResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    PAT:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        token_prefix: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
          description: "read = GET only (the gateway rejects mutations); write = default; admin also unlocks platform-admin routes for admin users"
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
    PATCreated:
      allOf:
        - $ref: "#/components/schemas/PAT"
        - type: object
          properties:
            token: { type: string }
    Org:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        role: { type: string }
        created_at: { type: string, format: date-time }
    Invite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
        token: { type: string }
        expires_at: { type: string, format: date-time }
    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        joined_at: { type: string, format: date-time }
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Deployment:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, building, ready, failed] }
        source: { type: string }
        git_sha: { type: string }
        git_branch: { type: string }
        image_ref: { type: string }
        build_id: { type: string, format: uuid }
        rollback_of: { type: string, format: uuid }
        commit_status: { type: string }
        preview_url: { type: string, description: "Traefik-backed preview hostname URL when Kind=Preview" }
        created_at: { type: string, format: date-time }
    Build:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        framework: { type: string }
        image_ref: { type: string }
        git_sha: { type: string }
        logs: { type: string }
        created_at: { type: string, format: date-time }
    RuntimeInstance:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        image_ref: { type: string }
        status: { type: string }
        desired_state: { type: string }
        mode: { type: string, enum: [simulate, docker] }
        health_status: { type: string }
        container_id: { type: string }
    Domain:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        status: { type: string }
        verification_type: { type: string }
        certificate_id: { type: string, format: uuid }
    Certificate:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        status: { type: string }
        provider: { type: string }
        expires_at: { type: string, format: date-time }
        renewed_at: { type: string, format: date-time }
    AddonCatalogItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [database, cache, queue] }
        description: { type: string }
        secret_keys:
          type: array
          items: { type: string }
        modes_supported:
          type: array
          items: { type: string }
    ManagedAddon:
      type: object
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        engine: { type: string }
        name: { type: string }
        mode: { type: string }
        status: { type: string }
        endpoint: { type: string }
        secret_ref: { type: string }
        connection_hint: { type: string }
        created_at: { type: string, format: date-time }
