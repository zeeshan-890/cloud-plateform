openapi: 3.0.3
info:
  title: jp Cloud Platform API
  version: 0.1.0
  description: Phase 1–7 public API via gateway (`/api/v1`).
servers:
  - url: http://localhost:8000/api/v1
    description: Local gateway
tags:
  - name: Users
  - name: System
  - name: Auth
  - name: Orgs
  - name: Projects
  - name: Git
  - name: Deployments
  - name: Builds
  - name: Runtime
  - name: Domains
  - name: Certificates
  - name: Secrets
  - name: Logs
  - name: Metrics
  - name: Storage
  - name: Databases
  - name: Addons
  - name: Cron
  - name: Queues
  - name: Config
  - name: AI
paths:
  /auth/bootstrap/status:
    get:
      tags: [Auth]
      summary: Is the platform initialised, and which registration mode applies
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }
                  registration: { type: string, enum: [closed, invite, open] }
  /auth/bootstrap:
    post:
      tags: [Auth]
      summary: Create the first platform administrator (only while uninitialised)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: Created (user is_admin = true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "403":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                invite_token: { type: string, description: "Required when REGISTRATION_MODE=invite; must belong to this email" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      tags: [Auth]
      summary: Login (two steps when MFA is enabled)
      description: |
        Step 1: send email + password. If the account has MFA enabled the response is
        `{mfa_required: true, mfa_token}` (token is single-use, valid 5 minutes, max 5 attempts).
        Step 2: send `mfa_token` + `totp_code` (a TOTP or a backup code) - the password is not resent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string, description: "username or e-mail" }
                email: { type: string, format: email, description: "legacy spelling of login" }
                password: { type: string }
                mfa_token: { type: string }
                totp_code: { type: string }
      responses:
        "200":
          description: Tokens, or an MFA challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - $ref: "#/components/schemas/MFAChallenge"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out - revokes the access token, its session and the refresh token
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
                all: { type: boolean, description: "Sign out every session" }
      responses:
        "204":
          description: No Content
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every session and token of the caller
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: No Content
  /auth/password:
    post:
      tags: [Auth]
      summary: Change password (revokes all sessions)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "200":
          description: Password changed; sign in again
        "401":
          $ref: "#/components/responses/Error"
  /auth/mfa/setup:
    post:
      tags: [Auth]
      summary: Start TOTP enrolment (when MFA is already enabled a current `code` is required)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        "200":
          description: Secret and otpauth URI
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_uri: { type: string }
        "409":
          $ref: "#/components/responses/Error"
  /auth/mfa/enable:
    post:
      tags: [Auth]
      summary: Confirm enrolment with a TOTP code; returns one-time backup codes
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  backup_codes:
                    type: array
                    items: { type: string }
  /auth/mfa/disable:
    post:
      tags: [Auth]
      summary: Disable MFA (requires a valid TOTP or backup code)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: OK
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Error"
  /auth/sessions:
    get:
      tags: [Auth]
      summary: List sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }
  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Revoke session
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
        "404":
          $ref: "#/components/responses/Error"
  /auth/pats:
    get:
      tags: [Auth]
      summary: List PATs
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pats:
                    type: array
                    items: { $ref: "#/components/schemas/PAT" }
    post:
      tags: [Auth]
      summary: Create PAT (token shown once)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PATCreated" }
  /auth/pats/{id}:
    delete:
      tags: [Auth]
      summary: Revoke PAT
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
  /orgs:
    get:
      tags: [Orgs]
      summary: List organizations for current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orgs:
                    type: array
                    items: { $ref: "#/components/schemas/Org" }
    post:
      tags: [Orgs]
      summary: Create organization
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string, pattern: "^[a-z0-9-]+$" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
  /orgs/{orgId}:
    get:
      tags: [Orgs]
      summary: Get organization
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
    delete:
      tags: [Orgs]
      summary: Delete organization (owner only; deletes all projects first)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "204":
          description: No Content
        "502":
          description: Some projects could not be cleaned up; the organization was kept
  /orgs/{orgId}/invites:
    post:
      tags: [Orgs]
      summary: Invite member by email
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role:
                  type: string
                  enum: [owner, admin, member, viewer]
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
    get:
      tags: [Orgs]
      summary: List pending invitations (admin+)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
  /orgs/{orgId}/invites/{inviteId}:
    delete:
      tags: [Orgs]
      summary: Revoke an invitation (admin+)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
  /orgs/invites/accept:
    post:
      tags: [Orgs]
      summary: Accept invite token
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  org: { $ref: "#/components/schemas/Org" }
                  role: { type: string }
  /orgs/{orgId}/users:
    post:
      tags: [Users]
      summary: Create an admin-managed user (org owner/admin; only an owner can create admins)
      description: |
        `password` is optional - when omitted the server generates one and returns it ONCE as `generated_password`.
        `must_change_password` defaults to true (the first login only yields a limited token).
        Username: lowercase `[a-z0-9._-]{3,32}`, globally unique. Grants: `{project_id, preset|areas, secrets_reveal}`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, username]
              properties:
                name: { type: string }
                username: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                role: { type: string, enum: [admin, member, viewer] }
                must_change_password: { type: boolean }
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: object }
                  generated_password: { type: string, description: "Shown once" }
        "409":
          $ref: "#/components/responses/Error"
    get:
      tags: [Users]
      summary: List members with status, last login and grants (admin+)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
  /orgs/{orgId}/users/{userId}:
    patch:
      tags: [Users]
      summary: Rename / disable (managed users) or change role
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                disabled: { type: boolean, description: "Disabling revokes all sessions immediately" }
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        "200":
          description: OK
    delete:
      tags: [Users]
      summary: Delete a user (managed accounts are deleted and all sessions revoked)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
        "409":
          $ref: "#/components/responses/Error"
  /orgs/{orgId}/users/{userId}/grants:
    put:
      tags: [Users]
      summary: Replace the project grants of a restricted user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "200":
          description: OK
  /orgs/{orgId}/users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: Reset a managed user's password (returned once; forces a change; revokes sessions)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
  /orgs/{orgId}/users/{userId}/sessions:
    get:
      tags: [Users]
      summary: Active sessions of a managed user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
  /orgs/{orgId}/users/{userId}/sessions/{sessionId}:
    delete:
      tags: [Users]
      summary: Revoke one session of a managed user
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
  /orgs/{orgId}/access-presets:
    get:
      tags: [Users]
      summary: Areas, levels and grant presets (viewer, developer, operator, project_admin, custom)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
  /orgs/{orgId}/members:
    get:
      tags: [Orgs]
      summary: List members
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
  /orgs/{orgId}/members/{userId}:
    patch:
      tags: [Orgs]
      summary: Change a member's role (owner only; the last owner cannot be demoted)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, member, viewer] }
      responses:
        "200":
          description: OK
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Orgs]
      summary: Remove a member (or leave the organization yourself)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: No Content
        "409":
          $ref: "#/components/responses/Error"
  /orgs/{orgId}/projects:
    get:
      tags: [Projects]
      summary: List projects
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [Projects]
      summary: Create project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
  /orgs/{orgId}/projects/{projectId}:
    get:
      tags: [Projects]
      summary: Get project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
    patch:
      tags: [Projects]
      summary: Update project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                description: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: "#/components/schemas/Project" }
    delete:
      tags: [Projects]
      summary: Delete project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "204": { description: No Content }

  /orgs/{orgId}/github/install/start:
    post:
      tags: [Git]
      summary: Start GitHub App install (real App URL when configured, else stub)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
  /orgs/{orgId}/github/install/callback:
    post:
      tags: [Git]
      summary: Complete GitHub install (App installation_id or stub)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "201":
          description: Created
  /github/setup:
    get:
      tags: [Git]
      summary: GitHub App setup redirect (public; state in Redis)
      parameters:
        - name: installation_id
          in: query
          schema: { type: string }
        - name: setup_action
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to dashboard
  /orgs/{orgId}/github/installations:
    get:
      tags: [Git]
      summary: List GitHub installations
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
  /orgs/{orgId}/github/repos:
    get:
      tags: [Git]
      summary: List available repos (mock or GitHub API)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/orgId" }]
      responses:
        "200":
          description: OK
  /orgs/{orgId}/projects/{projectId}/repos:
    get:
      tags: [Git]
      summary: List connected repos
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      responses:
        "200":
          description: OK
    post:
      tags: [Git]
      summary: Connect a repo to a project
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string }
                clone_url: { type: string }
                default_branch: { type: string }
                installation_id: { type: string }
      responses:
        "201":
          description: Created
  /orgs/{orgId}/projects/{projectId}/repos/{repoId}:
    delete:
      tags: [Git]
      summary: Disconnect repo
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/orgId"
        - $ref: "#/components/parameters/projectId"
        - name: repoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: No Content }
  /webhooks/github:
    post:
      tags: [Git]
      summary: GitHub webhook (HMAC X-Hub-Signature-256); push + pull_request previews
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Error"

  /orgs/{orgId}/projects/{projectId}/deployments:
    get:
      tags: [Deployments]
      summary: List deployments
      security: [{ bearerAuth: [] }]
